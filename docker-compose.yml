version: '3.9'
services:
  backend:
    build: ./backend
    ports:
      - '8000:8000'
    volumes:
      - ./data:/app/data
      - ./models:/app/models
    devices:
      - /dev/video0:/dev/video0     # pass webcam to container
    environment:
      - VIDEO_SOURCE=0

  frontend:
    build: ./frontend
    ports:
      - '3000:3000'
    depends_on:
      - backend
